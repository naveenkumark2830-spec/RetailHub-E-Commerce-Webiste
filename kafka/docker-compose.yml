services:
  kafka:
    image: apache/kafka:latest
    container_name: retailhub-kafka

    ports:
      - "9092:9092"

    environment:
      # ============================================================
      # KAFKA NODE / KRAFT
      # ============================================================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # ============================================================
      # LISTENERS
      # ============================================================
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      #KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://host.docker.internal:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ============================================================
      # SINGLE-BROKER SETTINGS
      # ============================================================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ============================================================
      # PERSISTENT KAFKA DATA
      # ============================================================
    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - kafka_default

    restart: unless-stopped


  # =================================================================
  # KAFKA TOPIC INITIALIZER
  # =================================================================
  #
  # This container waits for Kafka to become available and then
  # creates all required RetailHub topics.
  #
  # --if-not-exists means:
  #   Existing topic -> leave it untouched
  #   Missing topic  -> create it
  #
  # =================================================================

  kafka-init:
    image: apache/kafka:latest
    container_name: retailhub-kafka-init

    depends_on:
      - kafka

    networks:
      - kafka_default

    entrypoint: ["/bin/sh", "-c"]

    command: >
      "
      echo '================================================';
      echo '   RETAILHUB KAFKA TOPIC INITIALIZATION';
      echo '================================================';

      echo 'Waiting for Kafka to become ready...';

      until /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --list >/dev/null 2>&1;
      do
        sleep 2;
      done;

      echo 'Kafka is ready.';
      echo 'Creating/verifying RetailHub topics...';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_admin_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_cart_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_checkout_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_coupon_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_dead_letter
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_delivery_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_discovery_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_fraud_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_fulfillment_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_order_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_payment_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_return_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_review_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_system_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_user_events
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic retail_fraudguard_events
      --partitions 3
      --replication-factor 1;

      echo '================================================';
      echo '   ALL RETAILHUB TOPICS VERIFIED';
      echo '================================================';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --list;

      echo '================================================';
      "

    restart: "no"


# =====================================================================
# PERSISTENT VOLUME
# =====================================================================

volumes:
  kafka_data:
    name: retailhub_kafka_data


# =====================================================================
# NETWORK
# =====================================================================

networks:
  kafka_default:
    name: kafka_default